name: test_ci
on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "poc-copilot-test-workflow-review" ]

env:
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
#  COPILOT_API_TOKEN: ${{ secrets.COPILOT_PAT }}

jobs:
  linter:
    name: Linter
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo to VM (runner)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Fetch origin
        run: git fetch origin master

      - name: Python setup
        uses: actions/setup-python@v4
        with:
          python-version: 3.12.14

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y bc

      - name: Run linter
        run: |
          SCORE_LIMIT=9.9
          BASE=$(git merge-base origin/master HEAD)
          FILES=$(git diff --name-only --diff-filter=ACMR $BASE...HEAD | grep '\.py'$ | paste -sd' ' - || true)
          if [ -z "$FILES" ]; then
            echo "No python files has been changed, skipping linter"
          else
            echo "Changed files: $FILES"
            SCORE=$(pylint $FILES | grep 'Your code has been rated' | awk '{print $7}' | cut -d'/' -f1)
            echo "Static check score: $SCORE/10.0 - required: $SCORE_LIMIT"
            COMPARE=$(echo "$SCORE < $SCORE_LIMIT" | bc -l)
            if [ "$COMPARE" -eq 1 ]; then 
              echo "Code rating below threshold. Failing the job." 
              exit 1 
            fi
          fi

  int_test:
    name: Integration testing
    runs-on: ubuntu-latest

    env:
      DJANGO_ENV: int_test

    services:
      test_db:
        image: postgres:16-alpine3.20
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 60s
          --health-retries 5

    steps:
      - name: Clone repo to VM (runner)
        uses: actions/checkout@v3

      - name: Fetch origin
        run: git fetch origin master

      - name: Python setup
        uses: actions/setup-python@v4
        with:
          python-version: 3.12.14

      - name: Node setup
        uses: actions/setup-node@v6

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django database setup
        run: |
          python manage.py migrate

      - name: Run tests
        id: run-int-tests
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          timestamp=$(date +%Y%m%d%H%M%S)
          report_filename="test-results-${timestamp}.txt"
          echo REPORT_FILENAME=${report_filename} >> $GITHUB_ENV
          pytest --color=no --ignore=budget_app/tests/smoke/ 2>&1 | tee "${report_filename}"

      - name: Upload test results as XML Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-file
          if-no-files-found: ignore
          path: test-results-*.txt
          retention-days: 3

      - name: Analyze Failure with GitHub Copilot
        id: inference
        if: always() && steps.run-int-tests.outcome == 'failure'
        uses: actions/ai-inference@v1
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt-file: ./.github/prompts/test-failure.prompt.yml
          file_input: |
            test-report: ./${{ env.REPORT_FILENAME }}

      - name: Output Copilot analysis
        if: always() && steps.run-int-tests.outcome == 'failure'
        run: |
          echo "GitHub Copilot Analysis:"
          echo "${{ steps.inference.outputs.response }}"

      - name: Upload Copilot analysis as TXT Artifact
        if: always() && steps.run-int-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: copilot-analysis
          if-no-files-found: ignore
          path: copilot-analysis-*.txt
          retention-days: 3

      - name: Fail the job if tests failed
        if: steps.run-int-tests.outcome == 'failure'
        run: exit 1

  build_and_smoke:
    name: Build and smoke testing
    runs-on: ubuntu-latest
    needs: int_test

    steps:
      - name: Clone repo to VM (runner)
        uses: actions/checkout@v3

      - name: Create .env file
        run: |
          cat <<EOF > .env_github_ci
          DJANGO_ENV=${{ secrets.DJANGO_ENV }}
          DEBUG=${{ secrets.DEBUG }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
          DJANGO_SUPERUSER_USERNAME=${{ secrets.DJANGO_SUPERUSER_USERNAME }}
          DJANGO_SUPERUSER_EMAIL=${{ secrets.DJANGO_SUPERUSER_EMAIL }}
          DJANGO_SUPERUSER_PASSWORD=${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
          DJANGO_GENERIC_USERNAME=${{ secrets.DJANGO_GENERIC_USERNAME }}
          DJANGO_GENERIC_EMAIL=${{ secrets.DJANGO_GENERIC_EMAIL }}
          DJANGO_GENERIC_PASSWORD=${{ secrets.DJANGO_GENERIC_PASSWORD }}         
          EOF

      - name: Set-up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build and run docker container
        run: docker compose --env-file .env_github_ci -p myproj up -d

      - name: Show Django container logs
        run: docker logs tracker

      - name: Waiting for Django app
        run: |
          for i in {1..20}; do
            if docker exec tracker curl -f http://localhost:8000/; then
              echo "Django container is up and running!"
              exit 0
            else
              echo "Waiting for Django..."
              sleep 2
            fi
          done
          echo "Failed to connect to Django container after 20 attempts!"
          exit 1

      - name: Run smoke tests
        run: docker exec tracker pytest budget_app/tests/smoke