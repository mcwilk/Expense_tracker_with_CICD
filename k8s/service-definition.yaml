apiVersion: v1
kind: Service
metadata:
  name: myapp-service
spec:
  type: NodePort
  ports:
    - targetPort: 80
      port: 80
      nodePort: 30008
  selector:                 # deployment.yaml: spec.template.metadata.labels
    app: myapp
    type: backend

